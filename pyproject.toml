[project]
name = "yellow-flag-predictor"
version = "0.1.0"
description = "Caution-risk modelling for IMSA endurance races, from historical timing data to a live score"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
viz = ["matplotlib>=3.9"]

[project.scripts]
yellow-flag-predictor = "yellow_flag_predictor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yellow_flag_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
